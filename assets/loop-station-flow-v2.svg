<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="734" viewBox="0 0 2048 734" role="img" aria-labelledby="title desc">
  <title id="title">How the LOOP-STATION loop works</title>
  <desc id="desc">A dark workflow diagram showing Executor, Self-review, Reviewer, Decision, and Next session in sequence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071724"/>
      <stop offset="0.5" stop-color="#040d16"/>
      <stop offset="1" stop-color="#061912"/>
    </linearGradient>
    <linearGradient id="arrowFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18bfd4"/>
      <stop offset="0.55" stop-color="#55efc5"/>
      <stop offset="1" stop-color="#7af5a6"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#0b2633" stop-opacity=".82"/>
      <stop offset="1" stop-color="#02080d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity=".78"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .eyebrow { font: 800 24px Arial, Helvetica, sans-serif; fill: #4fe9c5; letter-spacing: .02em; }
      .headline { font: 800 39px Arial, Helvetica, sans-serif; fill: #f5f7fa; }
      .intro { font: 400 26px Arial, Helvetica, sans-serif; fill: #c5c9cf; }
      .title { font: 800 38px Arial, Helvetica, sans-serif; fill: #f5f7fa; }
      .line { font: 400 25px Arial, Helvetica, sans-serif; fill: #d2d6da; }
      .cyan { fill: #061725; fill-opacity: .48; stroke: #13c7dc; stroke-width: 2.2; }
      .green { fill: #061725; fill-opacity: .48; stroke: #58cf8e; stroke-width: 2.2; }
      .orbit { fill: none; stroke: #1ebba4; stroke-opacity: .34; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 8 16; }
    </style>
  </defs>

  <rect width="2048" height="734" rx="33" fill="url(#bg)"/>
  <rect x="0" y="0" width="2048" height="734" rx="33" fill="url(#spot)" opacity=".75"/>

  <path class="orbit" d="M490 117 C790 91 1214 86 1548 122 C1740 143 1892 188 1992 260"/>
  <path class="orbit" d="M185 588 C420 661 737 674 1044 673 C1325 672 1660 648 1864 563"/>

  <text x="109" y="104" class="eyebrow" filter="url(#shadow)">HOW THE LOOP WORKS</text>
  <text x="109" y="166" class="headline" filter="url(#shadow)">Run, review, decide, then continue.</text>
  <text x="109" y="218" class="intro">Agents do not act at the same time. They take turns through artifacts and status signals.</text>

  <g filter="url(#shadow)">
    <rect x="117" y="327" width="264" height="160" rx="18" class="cyan"/>
    <text x="166" y="386" class="title">Executor</text>
    <text x="166" y="428" class="line">runs session</text>
    <text x="166" y="462" class="line">produces results</text>
  </g>

  <path d="M381 404 H464 V384 L504 407 L464 430 V410 H381 Z" fill="url(#arrowFill)" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="519" y="327" width="288" height="160" rx="18" class="green"/>
    <text x="570" y="386" class="title">Self-review</text>
    <text x="570" y="428" class="line">checks evidence</text>
    <text x="570" y="462" class="line">opens review</text>
  </g>

  <path d="M807 404 H889 V384 L929 407 L889 430 V410 H807 Z" fill="url(#arrowFill)" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="942" y="327" width="278" height="160" rx="18" class="cyan"/>
    <text x="997" y="386" class="title">Reviewer</text>
    <text x="997" y="428" class="line">waits, reads</text>
    <text x="997" y="462" class="line">writes review</text>
  </g>

  <path d="M1220 404 H1295 V384 L1335 407 L1295 430 V410 H1220 Z" fill="url(#arrowFill)" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="1351" y="327" width="258" height="160" rx="18" class="green"/>
    <text x="1404" y="386" class="title">Decision</text>
    <text x="1395" y="428" class="line">consume review</text>
    <text x="1388" y="462" class="line">update summaries</text>
  </g>

  <path d="M1609 404 H1676 V384 L1717 407 L1676 430 V410 H1609 Z" fill="url(#arrowFill)" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="1720" y="329" width="257" height="158" rx="18" class="cyan"/>
    <text x="1754" y="406" class="title">Next session</text>
    <text x="1754" y="446" class="line">continue the loop</text>
  </g>
</svg>
