<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="734" viewBox="0 0 2048 734" role="img" aria-labelledby="title desc">
  <title id="title">How the LOOP-STATION loop works</title>
  <desc id="desc">Flow chart showing Executor, Self-review, Reviewer, Decision, and Next session stages in a continuous agent loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.54" stop-color="#04101a"/>
      <stop offset="1" stop-color="#061912"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18c7d4"/>
      <stop offset="0.55" stop-color="#59f0c5"/>
      <stop offset="1" stop-color="#7af5a8"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity=".65"/>
    </filter>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .eyebrow { font: 800 24px Arial, Helvetica, sans-serif; fill: #56e6c3; letter-spacing: .02em; }
      .headline { font: 800 38px Arial, Helvetica, sans-serif; fill: #f4f7fa; }
      .body { font: 400 25px Arial, Helvetica, sans-serif; fill: #c7cbd0; }
      .cardTitle { font: 800 37px Arial, Helvetica, sans-serif; fill: #f4f7fa; }
      .cardText { font: 400 25px Arial, Helvetica, sans-serif; fill: #d1d5d8; }
      .cyanCard { fill: #061725; fill-opacity: .58; stroke: #18c9dc; stroke-width: 2.3; }
      .greenCard { fill: #061725; fill-opacity: .58; stroke: #5ad08f; stroke-width: 2.3; }
      .loopLine { fill: none; stroke: #27c7ad; stroke-opacity: .34; stroke-width: 4; stroke-dasharray: 9 15; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="2048" height="734" rx="33" fill="url(#background)"/>
  <path class="loopLine" d="M491 117 C831 84 1300 84 1652 139 C1798 162 1916 203 1992 262"/>
  <path class="loopLine" d="M185 588 C431 664 739 676 1053 673 C1332 670 1674 647 1866 563"/>

  <text x="109" y="104" class="eyebrow" filter="url(#textShadow)">HOW THE LOOP WORKS</text>
  <text x="109" y="166" class="headline" filter="url(#textShadow)">Run, review, decide, then continue.</text>
  <text x="109" y="218" class="body">Agents do not act at the same time. They take turns through artifacts and status signals.</text>

  <g filter="url(#textShadow)">
    <rect x="117" y="327" width="264" height="160" rx="18" class="cyanCard"/>
    <text x="166" y="386" class="cardTitle">Executor</text>
    <text x="166" y="428" class="cardText">runs session</text>
    <text x="166" y="462" class="cardText">produces results</text>
  </g>

  <g filter="url(#softGlow)">
    <path d="M381 405 L466 405 L466 384 L504 406 L466 427 L466 410 L381 410 Z" fill="url(#arrow)"/>
  </g>

  <g filter="url(#textShadow)">
    <rect x="519" y="327" width="288" height="160" rx="18" class="greenCard"/>
    <text x="570" y="386" class="cardTitle">Self-review</text>
    <text x="570" y="428" class="cardText">checks evidence</text>
    <text x="570" y="462" class="cardText">opens review</text>
  </g>

  <g filter="url(#softGlow)">
    <path d="M807 405 L891 405 L891 384 L929 406 L891 427 L891 410 L807 410 Z" fill="url(#arrow)"/>
  </g>

  <g filter="url(#textShadow)">
    <rect x="942" y="327" width="278" height="160" rx="18" class="cyanCard"/>
    <text x="997" y="386" class="cardTitle">Reviewer</text>
    <text x="997" y="428" class="cardText">waits, reads</text>
    <text x="997" y="462" class="cardText">writes review</text>
  </g>

  <g filter="url(#softGlow)">
    <path d="M1220 405 L1295 405 L1295 384 L1335 406 L1295 427 L1295 410 L1220 410 Z" fill="url(#arrow)"/>
  </g>

  <g filter="url(#textShadow)">
    <rect x="1351" y="327" width="258" height="160" rx="18" class="greenCard"/>
    <text x="1404" y="386" class="cardTitle">Decision</text>
    <text x="1395" y="428" class="cardText">consume review</text>
    <text x="1388" y="462" class="cardText">update summaries</text>
  </g>

  <g filter="url(#softGlow)">
    <path d="M1609 405 L1678 405 L1678 384 L1717 406 L1678 427 L1678 410 L1609 410 Z" fill="url(#arrow)"/>
  </g>

  <g filter="url(#textShadow)">
    <rect x="1720" y="329" width="257" height="158" rx="18" class="cyanCard"/>
    <text x="1754" y="406" class="cardTitle">Next session</text>
    <text x="1754" y="446" class="cardText">continue the loop</text>
  </g>
</svg>
