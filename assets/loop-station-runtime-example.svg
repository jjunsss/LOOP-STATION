  <g font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700">
    <text x="618" y="25" fill="#544d55">• Working</text>
    <text x="708" y="25" fill="#8a858c">(5h 23m 26s · esc to interrupt)</text>
    <rect x="596" y="46" width="542" height="56" fill="#eee7e1"/>
    <text x="598" y="79" fill="#151821" font-size="20">›</text>
    <rect x="614" y="64" width="8" height="21" fill="none" stroke="#20242c" stroke-width="1.5"/>
    <text x="645" y="116" fill="#b4aab0">gpt-5.5 xhigh fast · /data/jjunsss/splatting/HLS · Main [defa...]</text>
  </g>
</svg>
