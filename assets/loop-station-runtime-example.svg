<svg xmlns="http://www.w3.org/2000/svg" width="1145" height="120" viewBox="0 0 1145 120" role="img" aria-labelledby="title desc">
  <title id="title">LOOP-STATION runtime example</title>
  <desc id="desc">A real-use style runtime capture showing Claude monitors still running and a Codex session working for several hours.</desc>
  <rect width="1145" height="120" fill="#f7f0ea"/>

  <g font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700">
    <text x="8" y="24" fill="#7c7b7f">* churned for 3m 18s · 5 monitors still running</text>
    <line x1="8" y1="56" x2="556" y2="56" stroke="#a8a2a0" stroke-width="1"/>
    <line x1="8" y1="92" x2="556" y2="92" stroke="#a8a2a0" stroke-width="1"/>
    <text x="8" y="82" fill="#151821" font-size="26">›</text>
    <rect x="27" y="66" width="9" height="22" fill="#151821" rx="1"/>
    <text x="24" y="114" fill="#b35875">▫▫ bypass permissions on</text>
    <text x="225" y="114" fill="#0c8d96">· 5 monitors</text>
    <text x="330" y="114" fill="#8e8b91">· ↓ to manage</text>
  </g>

